<!DOCTYPE html>
<html lang="vi" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>F-FORUM v3 — AI Web, UI &amp; Knowledge Workbench</title>
    <meta
      name="description"
      content="F-FORUM v3 là không gian kiến tạo Web/UI bằng AI với Live Sandbox Preview, Diff &amp; Checks tự động, thư viện UI/UX tuyển chọn và cộng đồng học thuật."
    />
    <meta name="theme-color" content="#06080d" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='8' fill='%2306080d'/%3E%3Cpath d='M7 7.5L25 5.5L22.5 11.5L12.5 12.2L7 7.5Z' fill='%23f59e0b'/%3E%3Cpath d='M7 7.5L12.5 12.2V25.5L7 22.5V7.5Z' fill='%23f1efe9'/%3E%3Cpath d='M13.5 14.8L22.5 13.8L20.5 18.8L13.5 19.3V14.8Z' fill='%232dd4bf'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('fforum_theme');
          if (!saved) {
            var rawSettings = localStorage.getItem('fforum_v3_settings');
            if (rawSettings) {
              var parsed = JSON.parse(rawSettings);
              if (parsed && (parsed.theme === 'light' || parsed.theme === 'dark')) {
                saved = parsed.theme;
              }
            }
          }
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
