<!DOCTYPE html>
<html lang="vi" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>F-Forum — Không gian Kiến tạo Web &amp; Tri thức</title>
    <meta
      name="description"
      content="F-Forum là không gian kiến tạo Web/UI với Live View cô lập, Diff &amp; Check tự động và kho tài nguyên thực chiến."
    />
    <meta name="theme-color" content="#090a0d" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='8' fill='%23090a0d'/%3E%3Cpath d='M7 7.5L25 5.5L22.5 11.5L12.5 12.2L7 7.5Z' fill='%23c89b54'/%3E%3Cpath d='M7 7.5L12.5 12.2V25.5L7 22.5V7.5Z' fill='%23f4f1ea'/%3E%3Cpath d='M13.5 14.8L22.5 13.8L20.5 18.8L13.5 19.3V14.8Z' fill='%232dd4bf'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var saved = null;
          try {
            var rawSettings = localStorage.getItem('fforum_v3_settings');
            if (rawSettings) {
              var parsed = JSON.parse(rawSettings);
              if (parsed && (parsed.theme === 'light' || parsed.theme === 'dark')) {
                saved = parsed.theme;
              }
            }
          } catch (err) {}
          if (!saved) {
            var legacy = localStorage.getItem('fforum_theme');
            if (legacy === 'light' || legacy === 'dark') {
              saved = legacy;
            }
          }
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#090a0d' : '#f7f5f0');
          }
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="F-Forum — Xưởng thực hành web" />
    <meta property="og:description" content="Thử ý tưởng, xem bản dựng trong Live View và kiểm tra thay đổi với Diff &amp; Check." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
