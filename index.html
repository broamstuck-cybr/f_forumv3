    <script>
      (function () {
        try {
          var saved = null;
          var pref = 'dark';
          var ambient = 'on';
          var density = 'roomy';
          var wallpaper = 'dark';
          var lang = 'vi';
          try {
            var rawSettings = localStorage.getItem('fforum_v3_settings');
            if (rawSettings) {
              var parsed = JSON.parse(rawSettings);
              if (parsed) {
                if (parsed.themePreference === 'light' || parsed.themePreference === 'dark' || parsed.themePreference === 'system') {
                  pref = parsed.themePreference;
                }
                if (pref !== 'system' && (parsed.theme === 'light' || parsed.theme === 'dark')) {
                  saved = parsed.theme;
                } else if (!parsed.themePreference && (parsed.theme === 'light' || parsed.theme === 'dark')) {
                  saved = parsed.theme;
                }
                if (parsed.ambientVideo === false) ambient = 'off';
                if (parsed.compactDensity === true) density = 'compact';
                if (typeof parsed.wallpaperPreset === 'string') wallpaper = parsed.wallpaperPreset;
                if (parsed.language === 'en' || parsed.language === 'vi') lang = parsed.language;
              }
            }
          } catch (err) {}
          if (!saved && pref === 'dark') {
            var legacy = localStorage.getItem('fforum_theme');
            if (legacy === 'light' || legacy === 'dark') {
              saved = legacy;
            }
          }
          var systemDark = true;
          try {
            if (window.matchMedia) {
              systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          } catch (err) {}
          var theme = saved === 'light' || saved === 'dark' ? saved : (pref === 'system' ? (systemDark ? 'dark' : 'light') : 'dark');
          var darkPresets = { dark: 1, aurora: 1, ember: 1, lagoon: 1 };
          var lightPresets = { light: 1, sage: 1, harbour: 1, lilac: 1 };
          if (wallpaper === 'constellation' || wallpaper === 'sunset') wallpaper = 'ember';
          if (wallpaper === 'indigo') wallpaper = 'aurora';
          if (wallpaper === 'auto' || (!darkPresets[wallpaper] && !lightPresets[wallpaper])) {
            wallpaper = theme === 'light' ? 'light' : 'dark';
          }
          if (theme === 'light' && darkPresets[wallpaper]) wallpaper = 'light';
          if (theme === 'dark' && lightPresets[wallpaper]) wallpaper = 'dark';
          var root = document.documentElement;
          root.lang = lang;
          root.dataset.theme = theme;
          root.dataset.ambient = ambient;
          root.dataset.wallpaper = wallpaper;
          root.dataset.density = density;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0b0e10' : '#f8faf8');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0e10;
        color: #f3f5f6;

      html[data-theme='light'],

        color: #101514;
      }
      .ff-boot {
        position: fixed;
        inset: 0;
        z-index: 95;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(11, 14, 16, 0.42);
        backdrop-filter: blur(4px);
      }
      html[data-theme='light'] .ff-boot {
        background: rgba(248, 250, 248, 0.48);
      }
      .ff-boot-card {
        width: 248px;
        padding: 24px 20px 20px;
        border-radius: 26px;
        border: 1px solid rgba(56, 201, 154, 0.24);
        background: rgba(18, 22, 25, 0.92);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
        font-family: Georgia, serif;
      }
      html[data-theme='light'] .ff-boot-card {
        border-color: rgba(10, 110, 80, 0.2);
        background: rgba(255, 255, 255, 0.94);
      }
      .ff-boot-sys {
        position: relative;
        width: 140px;
        height: 116px;
      }
      .ff-boot-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--d);
        height: var(--d);
        margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
        border-radius: 50%;
        border: 1.5px solid rgba(56, 201, 154, 0.24);
        transform: rotate(var(--tilt)) scaleY(0.38);
      }
      html[data-theme='light'] .ff-boot-ring {
        border-color: rgba(10, 110, 80, 0.22);
      }
      .ff-boot-core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        background: radial-gradient(circle at 36% 32%, #e6fff6, #38c99a 56%, #0a6e50 100%);
        box-shadow: 0 0 24px rgba(56, 201, 154, 0.55);
      }
      .ff-boot-title {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 600;
      }
      .ff-boot-sub {
        margin: 0;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        opacity: 0.72;
      }
