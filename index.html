    <script>
      (function () {
        try {
          var saved = null;
          var pref = 'dark';
          var ambient = 'on';
          var density = 'roomy';
          var wallpaper = 'dark';
          try {
            var rawSettings = localStorage.getItem('fforum_v3_settings');
            if (rawSettings) {
              var parsed = JSON.parse(rawSettings);
              if (parsed) {
                if (parsed.themePreference === 'light' || parsed.themePreference === 'dark' || parsed.themePreference === 'system') {
                  pref = parsed.themePreference;
                }
                if (pref !== 'system' && (parsed.theme === 'light' || parsed.theme === 'dark')) {
                  saved = parsed.theme;
                } else if (!parsed.themePreference && (parsed.theme === 'light' || parsed.theme === 'dark')) {
                  saved = parsed.theme;
                }
                if (parsed.ambientVideo === false) ambient = 'off';
                if (parsed.compactDensity === true) density = 'compact';
                if (typeof parsed.wallpaperPreset === 'string') wallpaper = parsed.wallpaperPreset;
              }
            }
          } catch (err) {}
          if (!saved && pref === 'dark') {
            var legacy = localStorage.getItem('fforum_theme');
            if (legacy === 'light' || legacy === 'dark') {
              saved = legacy;
            }
          }
          var systemDark = true;
          try {
            if (window.matchMedia) {
              systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          } catch (err) {}
          var theme = saved === 'light' || saved === 'dark' ? saved : (pref === 'system' ? (systemDark ? 'dark' : 'light') : 'dark');
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.ambient = ambient;
          root.dataset.wallpaper = wallpaper;
          root.dataset.density = density;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#121110' : '#f4f0e6');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,

      .ff-boot {
        position: fixed;
        inset: 0;
        z-index: 95;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(12, 11, 10, 0.36);
        backdrop-filter: blur(4px);
      }
      html[data-theme='light'] .ff-boot {

      }
      .ff-boot-card {
        width: 248px;
        padding: 24px 20px 20px;
        border-radius: 26px;
        border: 1px solid rgba(243, 238, 227, 0.22);
        background: rgba(24, 23, 22, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
        font-family: Georgia, serif;
      }
      html[data-theme='light'] .ff-boot-card {
        border-color: rgba(20, 18, 14, 0.2);
        background: rgba(251, 248, 241, 0.92);
      }
      .ff-boot-sys {
        position: relative;
        width: 140px;
        height: 116px;
      }
      .ff-boot-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--d);
        height: var(--d);
        margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
        border-radius: 50%;
        border: 1.5px solid rgba(243, 238, 227, 0.2);
        transform: rotate(var(--tilt)) scaleY(0.38);
      }
      html[data-theme='light'] .ff-boot-ring {
        border-color: rgba(20, 18, 14, 0.2);
      }
      .ff-boot-core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        background: radial-gradient(circle at 36% 32%, #fff8f0, #ff6450 58%, #8f1f14 100%);
        box-shadow: 0 0 24px rgba(255, 100, 80, 0.55);
      }
      .ff-boot-title {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 600;
      }
      .ff-boot-sub {
        margin: 0;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        opacity: 0.72;
