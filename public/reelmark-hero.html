<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reelmark — Captivate Crowds with Snackable Reels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter+Tight:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F8EF;
      --green: #08482D;
      --mint: #DAE7C7;
      --ink: #101410;
      --sub: #5E5E61;
      --u: min(calc(100vw / 1440), calc(100vh / 1080));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame {
      position: relative;
      width: calc(1440 * var(--u));
      height: calc(1080 * var(--u));
      background: var(--bg);
      overflow: hidden;
      user-select: none;
    }
    .logo {
      position: absolute;
      left: calc(37 * var(--u));
      top: calc(36 * var(--u));
      display: flex;
      align-items: center;
      gap: calc(9 * var(--u));
      font-family: "Inter Tight", sans-serif;
      font-weight: 700;
      font-size: calc(23 * var(--u));
      letter-spacing: -0.03em;
      color: var(--ink);
      text-decoration: none;
    }
    .logo svg {
      width: calc(26 * var(--u));
      height: calc(26 * var(--u));
      color: var(--green);
    }
    .nav {
      position: absolute;
      left: calc(505 * var(--u));
      top: calc(38 * var(--u));
      display: flex;
      gap: calc(31 * var(--u));
      font-size: calc(16.4 * var(--u));
      font-weight: 500;
    }
    .nav a { color: var(--ink); text-decoration: none; }
    .btn-login {
      position: absolute;
      left: calc(1211 * var(--u));
      top: calc(29 * var(--u));
      width: calc(92 * var(--u));
      height: calc(40 * var(--u));
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      border: 1px solid rgba(16,20,16,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(14.5 * var(--u));
      font-weight: 500;
      text-decoration: none;
    }
    .btn-signup {
      position: absolute;
      left: calc(1304 * var(--u));
      top: calc(29 * var(--u));
      width: calc(97 * var(--u));
      height: calc(40 * var(--u));
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(14.5 * var(--u));
      font-weight: 500;
      text-decoration: none;
    }
    .badge {
      position: absolute;
      left: calc(575 * var(--u));
      top: calc(115 * var(--u));
      width: calc(292 * var(--u));
      height: calc(37 * var(--u));
      border-radius: 999px;
      background: var(--mint);
      color: var(--green);
      font-weight: 500;
      font-size: calc(16.6 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      position: absolute;
      left: 50%;
      top: calc(176 * var(--u));
      transform: translateX(-50%);
      width: calc(1120 * var(--u));
      text-align: center;
      font-family: "Inter Tight", sans-serif;
      font-weight: 700;
      font-size: calc(88 * var(--u));
      line-height: calc(92 * var(--u));
      letter-spacing: -0.035em;
      color: var(--ink);
    }
    h1 span { display: block; letter-spacing: -0.022em; }
    .subline {
      position: absolute;
      left: 50%;
      top: calc(394 * var(--u));
      transform: translateX(-50%);
      width: calc(740 * var(--u));
      text-align: center;
      font-size: calc(20.8 * var(--u));
      line-height: calc(32 * var(--u));
      color: var(--sub);
    }
    .doodle-slashes {
      position: absolute;
      left: calc(263 * var(--u));
      top: calc(377 * var(--u));
      width: calc(44 * var(--u));
      height: calc(48 * var(--u));
      color: var(--green);
    }
    .note-beseen {
      position: absolute;
      left: calc(1212 * var(--u));
      top: calc(310 * var(--u));
      transform: rotate(16deg);
      font-family: "Caveat", cursive;
      font-weight: 600;
      font-size: calc(29 * var(--u));
      line-height: 0.96;
      color: var(--green);
      text-align: center;
    }
    .arrow-beseen {
      position: absolute;
      left: calc(1224 * var(--u));
      top: calc(376 * var(--u));
      width: calc(96 * var(--u));
      height: calc(124 * var(--u));
      color: var(--green);
    }
    .carousel {
      position: absolute;
      inset: 0;
      cursor: grab;
      touch-action: pan-y;
    }
    .carousel.dragging { cursor: grabbing; }
    .card {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      background: #1b2a22;
      will-change: transform, width, height, clip-path;
    }
    .tile-host {
      position: absolute;
      top: 0;
      left: 0;
    }
    .tile-host img, .tile-host video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    .tile-host video { opacity: 0; transition: opacity 0.35s; }
    .tile-host video.ready { opacity: 1; }
    .play-pill {
      position: absolute;
      left: calc(14 * var(--u));
      bottom: calc(14 * var(--u));
      width: calc(34 * var(--u));
      height: calc(34 * var(--u));
      border-radius: 50%;
      background: rgba(255,255,255,0.28);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .note-zerocost {
      position: absolute;
      left: calc(521 * var(--u));
      top: calc(937 * var(--u));
      transform: rotate(24deg);
      font-family: "Caveat", cursive;
      font-weight: 600;
      font-size: calc(28 * var(--u));
      color: var(--green);
    }
    .arrow-zerocost {
      position: absolute;
      left: calc(575 * var(--u));
      top: calc(916 * var(--u));
      width: calc(48 * var(--u));
      height: calc(36 * var(--u));
      color: var(--green);
    }
    .cta-ring {
      position: absolute;
      left: calc(626 * var(--u));
      top: calc(901 * var(--u));
      width: calc(190 * var(--u));
      height: calc(74 * var(--u));
      border-radius: 999px;
      border: 1.6px dashed var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cta-btn {
      width: calc(172 * var(--u));
      height: calc(58 * var(--u));
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      border: 0;
      font-family: "Inter", sans-serif;
      font-weight: 600;
      font-size: calc(16.5 * var(--u));
      cursor: pointer;
    }
    .draw-path {
      stroke-dasharray: 240;
      stroke-dashoffset: 0;
    }
    @media (max-width: 820px) {
      :root {
        --u: calc(100vw / 640);
      }
      body {
        align-items: flex-start;
      }
      .frame {
        width: 100%;
        height: auto;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 18px 16px 32px;
      }
      .topbar {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        position: static;
        font-size: 21px;
        gap: 8px;
      }
      .logo svg { width: 24px; height: 24px; }
      .nav, .btn-login, .doodle-slashes, .note-beseen, .arrow-beseen, .arrow-zerocost {
        display: none;
      }
      .btn-signup {
        position: static;
        width: auto;
        height: 38px;
        padding: 0 18px;
        font-size: 14px;
      }
      .badge {
        position: static;
        width: auto;
        height: 35px;
        padding: 0 16px;
        font-size: 13.5px;
        margin-top: 20px;
      }
      h1 {
        position: static;
        transform: none;
        width: 100%;
        font-size: clamp(38px, 9.5vw, 56px);
        line-height: 1.05;
        margin-top: 14px;
      }
      .subline {
        position: static;
        transform: none;
        width: 100%;
        max-width: 520px;
        font-size: 15.5px;
        line-height: 1.5;
        margin-top: 12px;
      }
      .carousel {
        position: relative;
        width: 100%;
        height: 250px;
        margin-top: 20px;
        overflow: hidden;
      }
      .cta-ring {
        position: static;
        width: 186px;
        height: 70px;
        margin-top: 20px;
      }
      .cta-btn {
        width: 168px;
        height: 54px;
        font-size: 15.5px;
      }
      .note-zerocost {
        position: static;
        transform: rotate(-6deg);
        font-size: 24px;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="frame" id="frame">
    <div class="topbar" id="topbar">
      <a class="logo" href="#">
        <svg viewBox="0 0 28 28" fill="none"><path d="M23.5 4.5C15.2 4.5 7.5 9.6 5.4 18.2C4.9 20.3 5.2 22.4 5.2 22.4C5.2 22.4 7.3 22.7 9.4 22.2C18 20.1 23.5 12.8 23.5 4.5Z" fill="currentColor"/><path d="M5.5 22.5C10.5 16.5 15.8 12.2 22.2 8.5" stroke="#F5F8EF" stroke-width="2" stroke-linecap="round"/></svg>
        Reelmark
      </a>
      <nav class="nav">
        <a href="#">Brands</a>
        <a href="#">Creators</a>
        <a href="#">Pricing</a>
        <a href="#">Use Cases</a>
        <a href="#">Contact</a>
      </nav>
      <a class="btn-login" href="#">Log in</a>
      <a class="btn-signup" href="#">Sign up</a>
    </div>
    <div class="badge" id="badge">Trusted by 120,000+ indie makers</div>
    <h1><span class="hl-1">Captivate Crowds</span><span class="hl-2">with Snackable Reels</span></h1>
    <p class="subline" id="subline">Grow your brand with short, snappy product clips by<br/>our handpicked video makers. Our crew is ready to<br/>lift your next launch higher.</p>
    <svg class="doodle-slashes" viewBox="0 0 44 48" fill="none"><path class="draw-path" d="M16 6 C12 18 8 30 4 42 M34 4 C29 17 24 30 19 43" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
    <div class="note-beseen">Be seen<br/>with clips</div>
    <svg class="arrow-beseen" viewBox="0 0 96 124" fill="none"><path class="draw-path" d="M42 6 C68 28 74 72 40 112" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path class="draw-path" d="M35 98 L39 114 L55 107" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="carousel" id="carousel"></div>
    <div class="note-zerocost">Zero cost</div>
    <svg class="arrow-zerocost" viewBox="0 0 48 36" fill="none"><path class="draw-path" d="M4 28 C18 30 30 22 42 10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path class="draw-path" d="M33 8 L43 9 L41 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="cta-ring" id="ctaRing"><button class="cta-btn" type="button">Make a Reel</button></div>
  </div>
  <script>
    const POSTER = "https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b7ebb74a-8c8a-4f7e-8f80-55e2d74ecd05.webp";
    const VIDEO = "https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/04fd3d5f-99d7-476e-98a4-46c08518ffb3.mp4";
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const carousel = document.getElementById("carousel");
    const cards = [];
    const N = 10, PITCH = 196, SPAN = N * PITCH;
    for (let i = 0; i < N; i++) {
      const card = document.createElement("div");
      card.className = "card";
      const host = document.createElement("div");
      host.className = "tile-host";
      const img = document.createElement("img");
      img.src = POSTER;
      host.appendChild(img);
      let vid = null;
      if (!reducedMotion) {
        vid = document.createElement("video");
        vid.src = VIDEO;
        vid.muted = true; vid.loop = true; vid.playsInline = true; vid.autoplay = true;
        vid.addEventListener("loadeddata", () => vid.classList.add("ready"));
        host.appendChild(vid);
      }
      const pill = document.createElement("div");
      pill.className = "play-pill";
      pill.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><polygon points="4,2.5 13.5,8 4,13.5"/></svg>';
      card.append(host, pill);
      carousel.appendChild(card);
      cards.push({ card, host, vid });
    }
    if (!reducedMotion) {
      setInterval(() => {
        const master = cards[0]?.vid;
        if (!master) return;
        const t = master.currentTime;
        for (let i = 1; i < cards.length; i++) {
          const v = cards[i].vid;
          if (v && Math.abs(v.currentTime - t) > 0.15) {
            try { v.currentTime = t; } catch {}
          }
        }
      }, 1500);

      const ease = "cubic-bezier(0.22, 1, 0.36, 1)";
      document.getElementById("topbar")?.animate([{ opacity: 0, transform: "translateY(-16px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 420, easing: ease, fill: "both" });
      document.getElementById("badge")?.animate([{ opacity: 0, transform: "scale(0.86)" }, { opacity: 1, transform: "scale(1)" }], { duration: 420, delay: 60, easing: ease, fill: "both" });
      document.querySelector(".hl-1")?.animate([{ opacity: 0, transform: "translateY(18px)", filter: "blur(8px)" }, { opacity: 1, transform: "translateY(0)", filter: "blur(0px)" }], { duration: 480, delay: 110, easing: ease, fill: "both" });
      document.querySelector(".hl-2")?.animate([{ opacity: 0, transform: "translateY(18px)", filter: "blur(8px)" }, { opacity: 1, transform: "translateY(0)", filter: "blur(0px)" }], { duration: 480, delay: 170, easing: ease, fill: "both" });
      document.getElementById("subline")?.animate([{ opacity: 0, transform: "translate(-50%, 14px)" }, { opacity: 1, transform: "translate(-50%, 0)" }], { duration: 460, delay: 220, easing: ease, fill: "both" });
      carousel?.animate([{ opacity: 0, transform: "translateY(26px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 520, delay: 260, easing: ease, fill: "both" });
      document.getElementById("ctaRing")?.animate([{ opacity: 0, transform: "scale(0.86)" }, { opacity: 1, transform: "scale(1)" }], { duration: 440, delay: 320, easing: ease, fill: "both" });
      document.querySelectorAll(".draw-path").forEach((p) => p.animate([{ strokeDashoffset: 240 }, { strokeDashoffset: 0 }], { duration: 900, delay: 300, easing: ease, fill: "both" }));
      document.querySelectorAll(".note-beseen, .note-zerocost").forEach((n) => n.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: 360, easing: ease, fill: "both" }));
    }
    function quadPath(w, topL, hL, topR, hR, r) {
      const pts = [{x:0,y:topL},{x:w,y:topR},{x:w,y:topR+hR},{x:0,y:topL+hL}];
      const cr = Math.max(2, Math.min(r, w*0.25, hL*0.2, hR*0.2));
      const cmds = [];
      for (let i = 0; i < 4; i++) {
        const p = pts[(i+3)%4], c = pts[i], n = pts[(i+1)%4];
        const l1 = Math.hypot(p.x-c.x, p.y-c.y)||1, l2 = Math.hypot(n.x-c.x, n.y-c.y)||1;
        const s1x = c.x+(p.x-c.x)/l1*cr, s1y = c.y+(p.y-c.y)/l1*cr;
        const s2x = c.x+(n.x-c.x)/l2*cr, s2y = c.y+(n.y-c.y)/l2*cr;
        cmds.push((i===0?"M ":"L ")+s1x.toFixed(1)+" "+s1y.toFixed(1));
        cmds.push("Q "+c.x.toFixed(1)+" "+c.y.toFixed(1)+" "+s2x.toFixed(1)+" "+s2y.toFixed(1));
      }
      return "path('" + cmds.join(" ") + " Z')";
    }
    let offset = 0, vel = 0, dragging = false, lastX = 0, lastT = 0;
    const clock = document.documentElement.animate([], { duration: 1e9 });
    let prev = Number(clock.currentTime || 0);
    carousel.addEventListener("pointerdown", (e) => {
      dragging = true; carousel.classList.add("dragging"); vel = 0; lastX = e.clientX; lastT = performance.now();
      carousel.setPointerCapture(e.pointerId);
    });
    carousel.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const isPhone = window.innerWidth <= 820;
      const u = isPhone ? window.innerWidth / 640 : Math.min(window.innerWidth/1440, window.innerHeight/1080);
      const dx = (e.clientX - lastX) / Math.max(0.25, u);
      const now = performance.now(), dt = Math.max(0.004, (now - lastT)/1000);
      offset += dx; vel = dx / dt; lastX = e.clientX; lastT = now;
    });
    carousel.addEventListener("pointerup", () => { dragging = false; carousel.classList.remove("dragging"); });
    function tick() {
      requestAnimationFrame(tick);
      const now = Number(clock.currentTime || performance.now());
      const dt = Math.min(0.05, Math.max(0.001, (now - prev)/1000));
      prev = now;
      if (!dragging) {
        if (Math.abs(vel) > 1.5) { offset += vel * dt; vel *= Math.pow(0.05, dt); }
        else { vel = 0; if (!reducedMotion) offset -= 50 * dt; }
      }
      offset = ((offset % SPAN) + SPAN) % SPAN;
      const isPhone = window.innerWidth <= 820;
      const u = isPhone ? window.innerWidth / 640 : Math.min(window.innerWidth/1440, window.innerHeight/1080);
      const layerW = carousel.clientWidth || window.innerWidth;
      const layerH = carousel.clientHeight || 250;
      for (let i = 0; i < N; i++) {
        let t = i * PITCH + offset;
        t = ((((t + SPAN/2) % SPAN) + SPAN) % SPAN) - SPAN/2;
        const x = 720 + t * (1 + 0.083 * Math.pow(t/706, 2));
        const d = Math.abs(x - 720) / 706;
        const w = 170 + 48 * d * d;
        const xL = x - w/2, xR = x + w/2;
        const qL = Math.abs(xL - 720)/706, qR = Math.abs(xR - 720)/706;
        const hL = 280 + 92 * Math.pow(qL, 2.6), hR = 280 + 92 * Math.pow(qR, 2.6);
        const cy = isPhone ? (layerH / Math.max(0.2, u)) * 0.5 + 8 - 10 * d * d : 687 - 12 * d * d;
        const boxH = Math.max(hL, hR), boxTop = cy - boxH/2;
        const topL = (cy - hL/2 - boxTop)*u, topR = (cy - hR/2 - boxTop)*u;
        const pxW = w*u, pxH = boxH*u;
        const pxLeft = isPhone ? layerW * 0.5 + (xL - 720) * u : xL * u;
        const { card, host } = cards[i];
        card.style.width = pxW.toFixed(1)+"px"; card.style.height = pxH.toFixed(1)+"px";
        card.style.transform = `translate3d(${pxLeft.toFixed(1)}px, ${(boxTop*u).toFixed(1)}px, 0)`;
        card.style.clipPath = quadPath(pxW, topL, hL*u, topR, hR*u, 15*u);
        const col = i % 5, row = Math.floor(i / 5);
        const tileH = Math.max(pxH, pxW / 0.7111), tileW = tileH * 0.7111;
        host.style.width = (tileW*5).toFixed(1)+"px"; host.style.height = (tileH*2).toFixed(1)+"px";
        host.style.transform = `translate3d(${(-col*tileW).toFixed(1)}px, ${(-row*tileH).toFixed(1)}px, 0)`;
      }
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
